  <!-- motion lines: fast delivery -->
  <g stroke="#c6f6d5" stroke-width="18" stroke-linecap="round" opacity="0.9">
    <line x1="92" y1="382" x2="190" y2="382"/>
    <line x1="124" y1="414" x2="232" y2="414"/>
