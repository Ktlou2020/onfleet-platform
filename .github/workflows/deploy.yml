name: deploy

on:
  push:
    branches: [claude/keen-dijkstra-kDuhb]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to main (triggers Railway)
        run: git push origin HEAD:main
